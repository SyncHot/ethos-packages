services:
  vmm:
    # A bare Debian: QEMU, noVNC and Python are provisioned by bootstrap.sh and
    # cached in the vmm-data volume, so a package update reinstalls them offline.
    image: debian:12-slim
    container_name: ethos-vmm
    # Root inside the container: /dev/kvm access and 0660 NAS files on the
    # mounted shares. The shares are the only writable host paths, and the
    # service validates every path against /vmhost before touching it.
    user: "0:0"
    command: ["sh", "/app/bootstrap.sh"]
    # The only device a package may request: it needs the `kvm` capability in
    # manifest.json, and EthOS still rejects every other device.
    devices: ["/dev/kvm"]
    ports:
      # JSON API: NAS loopback only, reached through the authenticated EthOS
      # /api/packages/vmm/proxy/ endpoint.
      - "127.0.0.1:8095:8095"
      # Browser console: noVNC page + WebSocket bridge, every request needs a
      # signed 120 s ticket. Only the container port is fixed — Docker assigns a
      # free host port, so the package can never collide with another service
      # (the VM window discovers the mapping through /api/containers).
      - "8094"
      # Guest port forwards: QEMU hostfwd binds these *container* ports onto a
      # port inside the VM, and compose publishes the same range 1:1, so
      # http://<nas>:18190 can reach a guest's :9000. The range stays below the
      # ephemeral range (32768+) so Docker's dynamic console mapping cannot
      # collide with it. Keep it in sync with FORWARD_HOST_RANGE in server/qemu.py.
      - "18190-18194:18190-18194"
    volumes:
      - vmm-data:/data
      - ./server:/app:ro
      - /home:/vmhost/home
      - /mnt:/vmhost/mnt
      - /media:/vmhost/media
    stop_grace_period: 60s
    restart: unless-stopped
    # Guest RAM is allocated by QEMU inside this container, so a mem_limit would
    # kill VMs; keep the sum of VM memory within the NAS's free RAM instead. CPU
    # and process caps still stop a runaway guest from monopolising the host.
    cpus: 3.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8095/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start installs QEMU from the Debian mirror.
      start_period: 600s

volumes:
  vmm-data: {}
