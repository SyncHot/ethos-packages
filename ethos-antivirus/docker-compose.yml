services:
  clamav:
    image: clamav/clamav:1.5.5
    container_name: ethos-antivirus-clamd
    # NAS files often use 0660 permissions; scan as root to reach every share.
    # The host mounts below are read-only and the container has no write binds.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -i 's/^User clamav$/User root/' /etc/clamav/clamd.conf
        exec /init
    environment:
      CLAMD_CONF_User: root
    volumes:
      - clamav-db:/var/lib/clamav
      - /home:/scan/home:ro
      - /mnt:/scan/mnt:ro
      - /media:/scan/media:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  ui:
    image: python:3.12-alpine
    container_name: ethos-antivirus
    command: ["python", "/app/app.py"]
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - ./server:/app:ro
      # Settings, scan logs, quarantine copies and schedules survive updates.
      - antivirus-data:/data
      # The UI service walks the tree before handing files to clamd, so it
      # needs the same read-only view of the shares as the scanner container.
      - /home:/scan/home:ro
      - /mnt:/scan/mnt:ro
      - /media:/scan/media:ro
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      AV_DATA_DIR: /data
    depends_on:
      - clamav
    restart: unless-stopped
    healthcheck:
      # The UI service answers /api/health without touching clamd, so a failing
      # scan engine shows up separately from a dead control plane.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8092/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  clamav-db:
  antivirus-data:
