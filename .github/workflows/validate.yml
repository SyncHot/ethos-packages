name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install cryptography pyyaml
      - name: Run package service tests
        run: |
          python -m unittest discover -s ethos-sticky-notes/tests -v
          python -m unittest discover -s ethos-velvet/tests -v
      - name: Validate signed repository
        run: python .github/scripts/validate_repo.py
      - name: Check native modules parse as ES modules
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nodejs
          for f in */frontend/*.js; do
            echo "→ $f"
            node --input-type=module --check < "$f"
          done
