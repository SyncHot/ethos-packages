services:
  ethos-welcome:
    image: nginx:1.27-alpine
    container_name: ethos-welcome
    ports:
      - "8090:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
